[package]
name = "papermate-desktop"
version = "0.1.0"
description = "PaperMate 本地桌面客户端（Tauri 2 壳 + Python sidecar）"
authors = ["PaperMate"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
