<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>PaperMate 启动中…</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #0f1115;
        color: #cdd3df;
      }
      /* 首启面板约 680px 宽；卡片比 960 窗略窄，左右留白均衡不空洞 */
      .box { text-align: center; max-width: 680px; padding: 0 24px; }
      .spin {
        width: 28px; height: 28px;
        border: 3px solid #2a2f3a;
        border-top-color: #5b8cff;
        border-radius: 50%;
        animation: r 1s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes r { to { transform: rotate(360deg); } }
      #msg { font-size: 13px; color: #8b93a3; }
      #hint {
        font-size: 12px; color: #6b7383; margin-top: 10px;
        line-height: 1.7; text-align: left; white-space: pre-wrap;
      }
      #hint:empty { display: none; }
      /* 首启面板：后端还不存在时也要能显示（本页是包内本地资源） */
      #panel { display: none; text-align: left; margin-top: 4px; }
      /* 卡片化：让紧凑内容在 960×640 窗口里形成明确的视觉边界 */
      #panel .card {
        background: #161922;
        border: 1px solid #262c38;
        border-radius: 12px;
        padding: 20px 22px;
      }
      #panel h2 { font-size: 16px; margin: 0 0 4px; color: #dfe5f0; text-align: center; }
      #panel .sub { font-size: 12px; color: #8b93a3; text-align: center; margin: 0 0 16px; }
      #panel .row { font-size: 12.5px; color: #8b93a3; line-height: 2.0; }
      #panel .row b { color: #cdd3df; font-weight: 600; }
      #panel .k { display: inline-block; min-width: 76px; color: #6b7383; }
      #panel .warn {
        margin-top: 14px; padding: 10px 12px;
        background: rgba(224, 177, 106, 0.10);
        border: 1px solid rgba(224, 177, 106, 0.35);
        border-radius: 8px;
        color: #e0b16a; line-height: 1.7; font-size: 12px;
      }
      #panel .warn b { color: #f0cd95; }
      #panel .danger {
        margin-top: 12px; padding: 10px 12px;
        background: rgba(255, 143, 143, 0.10);
        border: 1px solid rgba(255, 143, 143, 0.35);
        border-radius: 8px;
        color: #ff8f8f; line-height: 1.7; font-size: 12px;
      }
      #panel .danger b { color: #ffb0b0; }
      #panel b { color: #dfe5f0; }
      /* frameless 窗口（decorations:false）下需要自带顶条：拖拽 + 关闭 */
      .tb {
        position: fixed; top: 0; left: 0; right: 0; height: 32px;
        display: flex; align-items: stretch; justify-content: space-between;
        background: #0f1115; color: #8b93a3;
        -webkit-user-select: none; user-select: none; z-index: 10;
      }
      .tb-drag {
        flex: 1; min-width: 0; display: flex; align-items: center;
        padding-left: 12px; font-size: 12px; letter-spacing: 0.3px; color: #8b93a3;
      }
      .tb-x {
        width: 44px; border: 0; background: transparent; color: #cdd3df;
        cursor: pointer; font-size: 15px; line-height: 1;
      }
      .tb-x:hover { background: #e0483d; color: #fff; }
      /* 让首启内容整体下沉 32px，避免被固定顶条压住 */
      .box { padding-top: 32px; }
    </style>
  </head>
  <body>
    <div class="tb">
      <div class="tb-drag" data-tauri-drag-region>PaperMate</div>
      <button class="tb-x" id="tb-close" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <div class="box">
      <div id="spin" class="spin"></div>
      <div id="msg">正在启动本地服务…</div>

      <!-- 首启面板：由 Rust 通过 eval 调用 window.pmFirstRun(...) 显示 -->
      <div id="panel">
        <div class="card">
          <h2>首次启动 · 请选择数据存放位置</h2>
          <p class="sub">以下位置将用于存放你的全部本地数据</p>
          <div class="row">
            <div><span class="k">默认位置</span><b id="p-default">…</b></div>
            <div><span class="k">可选磁盘</span><span id="p-drives">…</span></div>
            <div><span class="k">至少需要</span><b id="p-min">…</b> 可用空间</div>
          </div>
          <div class="warn">
            将在这个位置下创建 <b>data/</b>（数据库、上传的 PDF、索引）、<b>huggingface/</b>（模型权重）、
            <b>venv/</b> 与 <b>uv-cache/</b>（运行环境）。
          </div>
          <div id="p-existing" class="danger" hidden>
            检测到<b>默认位置已有数据</b>：请直接选择默认位置以继续使用现有数据。
            若选别的位置，将<b>新建一个空数据目录</b> —— 旧数据不会被删除，但应用将不再使用它。
          </div>
        </div>
      </div>

      <div id="hint"></div>
    </div>
    <script>
      // ─────────────────────────────────────────────────────────────────────
      // 本页由**包内本地资源**加载（tauri.conf.json: windows[0].url = "loading.html"）。
      //
      // ★★ 2026-10-07 修复：此前 url 指向 `http://127.0.0.1:8000/loading.html`，
      //    即"等待页本身要靠它所等待的后端才能显示"；而 Tauri 的顺序是
      //    「先按配置建窗口 → 再跑 setup 里的起后端」⇒ 窗口第一帧必然早于后端。
      //    后端没起来时窗口就停在 WebView2 的连接错误页、且**不会自愈**
      //    （真机首装要装几十分钟，必然撞上）。现在本地加载，后端没起也能显示本页。
      //
      // 本页还承担**首次启动**的说明面板（`window.pmFirstRun`）：
      //   ★ 用户的实际操作发生在 **Rust 弹出的原生文件夹选择器**里
      //     ⇒ 这里**不需要** JS→Rust 的 IPC，也就不需要 capability。
      //   Rust 只用已有的 `eval` 通道调用下面两个全局函数。
      //
      // 就绪后由 **Rust 侧**把窗口导航到真实 UI（它才确切知道后端起没起）——
      // 见 lib.rs::navigate_when_backend_ready。下面这道探测只是**兜底**。
      //
      // ★ 兜底探测必须用 { mode: "no-cors" }：
      //   本页 origin 是 tauri.localhost，与 127.0.0.1:8000 **跨源**，
      //   而后端**没有 CORS 中间件** ⇒ 普通 fetch 会被 CORS 拦：
      //   即使后端已就绪也永远拿不到 r.ok，会无限重试。
      //   no-cors 是"简单请求"、不需要 CORS 头：
      //     · 服务器有响应 ⇒ promise resolve（opaque 响应，读不到状态码）
      //     · 连接被拒/不可达 ⇒ promise reject
      //   ⇒ 正好可用作"端口通了没"的可达性探测。
      // ─────────────────────────────────────────────────────────────────────
      (function () {
        var BASE = "http://127.0.0.1:8000";
        var T0 = Date.now();
        var hintShown = false;
        var firstRun = false;

        function el(id) { return document.getElementById(id); }

        function tick() {
          var sec = Math.round((Date.now() - T0) / 1000);
          // ★ 首启面板显示期间不要覆盖它的标题（否则用户看不到"请选择数据位置"）
          if (!firstRun) {
            el("msg").textContent = "正在启动本地服务… 已等待 " + sec + " 秒";
          }

          // 超过 8 秒还没就绪，多半是**首次启动正在装运行环境**（下载 + 安装依赖）；
          // 也可能是用户正在原生对话框里挑目录。两种都明确告知，避免被当成卡死。
          if (!hintShown && sec >= 8 && !firstRun) {
            hintShown = true;
            el("hint").textContent =
              "首次启动需要安装本地运行环境，视网速可能持续数分钟。\n" +
              "期间请不要关闭本窗口 —— 安装会被中断。";
          }

          fetch(BASE + "/api/v1/healthz?t=" + Date.now(), {
            mode: "no-cors",
            cache: "no-store"
          })
            .then(function () { location.href = BASE + "/"; })
            .catch(function () { setTimeout(tick, 1000); });
        }

        // Rust 在首启时调用：切到「选择数据位置」形态
        window.pmFirstRun = function (o) {
          firstRun = true;
          el("spin").style.display = "none";
          // ★ 隐藏顶部小灰字（#msg），避免与面板 h2 出现"重复标题"两行
          el("msg").style.display = "none";
          el("panel").style.display = "block";
          el("p-default").textContent = o && o.defaultRoot ? o.defaultRoot : "…";
          el("p-drives").textContent = o && o.drives ? o.drives : "…";
          el("p-min").textContent = o && o.minFreeGb ? String(o.minFreeGb) + " GB" : "…";
          // ★ 默认位置已有数据时必须**醒目提醒**，否则用户误选别处会以为"数据全丢了"
          if (o && o.hasExisting) {
            el("p-existing").hidden = false;
          }
          el("hint").textContent =
            "即将弹出文件夹选择窗口（默认已定位到上面这个位置）：选好后点「确定」。\n" +
            "直接关闭该窗口 = 使用上面的默认位置（之后可在设置页再改）。";
        };

        // Rust 在位置确定后调用（含"用户取消 ⇒ 用默认"，不静默）
        window.pmRootChosen = function (root) {
          firstRun = false;
          el("panel").style.display = "none";
          el("msg").style.display = ""; // 恢复顶部状态行（tick 会继续更新它）
          el("spin").style.display = "";
          el("hint").textContent = "数据位置：" + root;
        };

        // ★ frameless 窗口（decorations:false）自带顶条：拖拽区由 tauri 的 drag.js 处理，
        //   这里只给「关闭」按钮接上真正的窗口 API。直接走核心 IPC（plugin:window|close），
        //   不依赖 @tauri-apps/api 命名空间（远程源下就绪时序更脆）。
        var tbClose = el("tb-close");
        if (tbClose && window.__TAURI_INTERNALS__) {
          tbClose.addEventListener("click", function () {
            try { window.__TAURI_INTERNALS__.invoke("plugin:window|close"); } catch (e) {}
          });
        }

        tick();
      })();
    </script>
  </body>
</html>
