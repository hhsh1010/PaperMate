<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>PaperMate 启动中…</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #0f1115;
        color: #cdd3df;
      }
      .box { text-align: center; }
      .spin {
        width: 28px; height: 28px;
        border: 3px solid #2a2f3a;
        border-top-color: #5b8cff;
        border-radius: 50%;
        animation: r 1s linear infinite;
        margin: 0 auto 12px;
      }
      @keyframes r { to { transform: rotate(360deg); } }
      #msg { font-size: 13px; color: #8b93a3; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div id="msg">正在启动本地服务…</div>
    </div>
    <script>
      // 同源轮询后端健康检查；就绪后跳转到真实 UI（/）。
      // 后端由 Rust sidecar 拉起，可能比本页面晚几百毫秒，故失败重试即可。
      const BASE = "http://127.0.0.1:8000";
      function tick() {
        fetch(BASE + "/api/v1/healthz")
          .then(function (r) {
            if (r.ok) {
              location.href = BASE + "/";
            } else {
              setTimeout(tick, 1000);
            }
          })
          .catch(function () {
            setTimeout(tick, 1000);
          });
      }
      tick();
    </script>
  </body>
</html>
