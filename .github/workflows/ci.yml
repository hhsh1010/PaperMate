name: CI

# ★ 2026-10-10 建立：此前四道门禁（ruff / pytest / tsc+vitest / build）全靠手动跑，
# 仓库里躺着 1800+ 用例却没有自动化 —— 本文件把它们接到 push/PR 上。
#
# 设计取舍（都为了一次跑绿、少烧额度）：
#  1) 后端只装**基础依赖**（uv sync --frozen）：torch/faiss/FlagEmbedding 在 [rag] extra，
#     不进 CI（否则单次 ≥4GB 下载）。缺 [rag] 的用例由 pytest.importorskip 优雅跳过。
#  2) 后端跑 `-m "not slow"`（实测 1685/1833 用例）：slow 多为数值密集/模型加载用例，
#     留在本地发布门禁；CI 只守「快速回归」。
#  3) xdist 用 `-n 2`：本仓库实测单 worker 峰值 ~960MB，GitHub 托管 runner 7GB 内存下 2 个安全。
#  4) 同一分支新推送取消旧任务（concurrency），省额度。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 手动触发：首次接入时先手动跑一次验证再开自动

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        # 按本地开发版本钉住：`uvx ruff`（不带版本）会拉最新版，新规则可能让既存代码突然变红。
        # 升级 ruff 应是一次**显式**的改动（本地跑通后再改这里）。
        run: uvx ruff@0.16.6 check src tests

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --no-file-parallelism
      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest, not slow)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install base deps (frozen lock)
        run: uv sync --frozen
      - name: Install lightweight retrieval/parse deps (CI-only)
        # ★ 2026-10-10 实测得出（轻依赖 venv 仿真：1685 用例 → 158 failed，原因高度集中）：
        #   缺失模块 faiss(397 次) / pymupdf(47) / huggingface_hub(11) 全是**轻量包**（合计 <60MB），
        #   而真正重型的是 torch / sentence_transformers（仅 17 处）。故 CI 补装这三个轻量包，
        #   换来绝大多数上传/解析/检索用例真正被执行；重依赖用例由下面的 --ignore 处理。
        #   版本按 uv.lock 锁定（可复现），不用浮动版本。
        #   ⚠️ 不要加 `--system`：那会装进 runner 的系统 Python，而 `uv run` 用的是项目 `.venv`
        #   （本 workflow 初稿就写错了这一处 —— 会让补装完全失效）。
        run: uv pip install faiss-cpu==1.15.0 pymupdf==1.28.2 huggingface-hub==0.36.2
      - name: pytest (not slow)
        # ★ 2026-10-10 首次 CI 实测（run 38053095414）：`-n 2`（xdist 并行）在 runner 上 10.5s 即失败，
        #   报 "Different tests were collected between gw0 and gw1"。注意缺的是
        #   test_export_to / test_eval_summary / test_failure_attribution 的**整个类**（不是个别用例）
        #   ⇒ 更像「某个 worker 在收集期异常」而非用例失败；且 tests/conftest.py 在**导入期**就改进程环境
        #   （PAPERMATE_DATA_DIR = mkdtemp(...)），并行下天然存在竞态面。
        #   ⇒ 现阶段**确定性优先**：CI 串行（-n 0）。代价是多几分钟运行时间，换来"不会偶发红"。
        #   ⏭️ 后续优化：并行化需要 runner 的**完整日志**才能定位那次 worker 异常（截图只到尾部不够）；
        #      定位后再恢复 -n 2。本地日常门禁仍用仓库自带的 -n 3（本地实测稳定）。
        #
        # ★ 排除名单是实测得出的：补装轻量包后浅依赖环境 1685 用例 → 剩余失败全部集中在这 4 个文件，
        #   根因均为缺 torch / sentence_transformers（状态与提示文案按"运行环境未就绪"分支走）。
        #   这 4 个文件已在**完整依赖的主 venv** 中复跑验证通过（query_rewrite + model_installer 共 94 passed）
        #   ⇒ 属**环境差异、非代码缺陷**，故 CI 排除；它们仍由本地发布门禁（全量）覆盖。
        #   若日后想让 CI 全覆盖：额外安装 torch（CPU 轮子）+ sentence-transformers
        #   （首次约 +600MB；setup-uv 的缓存会保留，后续不再重复下载）。
        run: >
          uv run --frozen python -m pytest -q -p no:cacheprovider
          -n 0
          -m "not slow"
          --ignore=tests/test_rerank_accel.py
          --ignore=tests/test_rag_device.py
          --ignore=tests/test_model_installer.py
          --ignore=tests/test_query_rewrite.py

      - name: Guard — 用例数下限（防"零用例通过"的假绿）
        # ★ 2026-10-10 加固起因：上一版 CI 走的是仓库自带启动器 scripts/run_tests.py，
        #   而它在"抢不到锁 / 进程表检测到疑似已有 pytest 实例"时会
        #   **打印 RESULT=SKIPPED 并 return 0** —— 那个 0 是"没跑测试"，不是"测试通过"。
        #   该启动器是为**本地沙箱 turn 重放**去重设计的（CI 没这个问题），
        #   且 CI 步骤 shell 的命令行里本身就含 `run_tests.py`、`uv run` 又会改变父链结构
        #   ⇒ 存在误判成 SKIPPED 的真实风险。处置：CI 直跑 pytest（不用启动器）。
        #
        # ★★ 2026-10-11 回归修复（**我自己造成的**）：换成直跑 pytest 时**漏了 `-n 0`** ——
        #   而 `pyproject.toml` 的 `addopts = "-n 3 --dist=loadfile"` 会补上 3 个 xdist worker
        #   ⇒ 并行把**已知的 xdist「different tests collected between gw0 and gw1」间歇性失败**
        #   带了回来（实测：同一命令在 54a1f5c 绿、在 ca66983 红）。这里显式 `-n 0` 覆盖 addopts，
        #   串行是确定性的（Linux runner 全量约 48s，代价可忽略）。
        #
        # 判据取自 `--collect-only` 的收集数：宁可红，也不接受"什么都没跑却绿"。
        run: |
          set -euo pipefail
          n=$(uv run --frozen python -m pytest --collect-only -q -n 0 -m "not slow" \
              --ignore=tests/test_rerank_accel.py \
              --ignore=tests/test_rag_device.py \
              --ignore=tests/test_model_installer.py \
              --ignore=tests/test_query_rewrite.py 2>&1 \
              | grep -oE "[0-9]+ tests? collected" | grep -oE "^[0-9]+" | head -1)
          echo "collected tests = ${n:-0}（下限 1500）"
          if [ -z "${n:-}" ] || [ "$n" -lt 1500 ]; then
            echo "::error::用例收集数过低（${n:-0} < 1500）—— 疑似未真正执行，拒绝假绿"
            exit 1
          fi
