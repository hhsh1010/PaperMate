# PaperMate 服务端部署（Nginx 反代 + 回滚友好镜像 tag）
#
# 安全默认：本项目无鉴权。papermate 仅对内网 expose（不映射宿主机端口），
# 由 nginx 统一出口；默认 nginx 也只绑 127.0.0.1，仅供本机访问。
# 需局域网/公网访问：把 ports 改为 "0.0.0.0:${HTTP_PORT}:80" 并自行评估风险
# （或在 nginx 前加一层鉴权 / WAF）。
#
# 用法：
#   1) cd web && npm ci && npm run build
#   2) cp .env.example .env            # 模型密钥（不入库）
#   3) cp deploy/.env.example deploy/.env   # 镜像 tag / 端口等
#   4) docker compose -f deploy/docker-compose.yml up -d --build
#   5) curl http://127.0.0.1/api/v1/healthz

services:
  papermate:
    image: ${REGISTRY:-ghcr.io/your-org}/papermate:${TAG:-latest}
    container_name: papermate
    restart: unless-stopped
    # 只对内网暴露，由 nginx 反代；不映射宿主机端口
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      PAPERMATE_HOST: "0.0.0.0"
      PAPERMATE_DATA_DIR: "/data"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    volumes:
      - papermate-data:/data
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # 首次启动可能在建索引
    networks: [pm]

  nginx:
    image: nginx:1.27-alpine
    container_name: papermate-nginx
    restart: unless-stopped
    ports:
      # 默认仅本机；局域网访问改为 "0.0.0.0:${HTTP_PORT}:80"
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      papermate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [pm]

volumes:
  papermate-data:

networks:
  pm:
    driver: bridge
